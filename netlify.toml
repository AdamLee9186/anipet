[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.user.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/search.js"
  to = "/Lionwheel - Enhanced Search 1.4.0.user.js"
  status = 200

[[redirects]]
  from = "/toolbox.js"
  to = "/Lionwheel - Anipet Toolbox-13.4.3.user.js"
  status = 200

[[redirects]]
  from = "/enhanced-search.js"
  to = "/Lionwheel - Enhanced Search with JSON-1.3.9.user.js"
  status = 200